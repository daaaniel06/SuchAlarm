[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PIE", "PERF", "PLE", "LOG", "T10", "ASYNC"]
ignore = [
  "E501",    # long SQL strings and German messages stay on one line; the formatter wraps code
  "RUF001",  # German typography (– „“) in user-facing text is intended
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC"]  # blocking calls only matter on the app's shared event loop

[tool.ruff.lint.isort]
known-first-party = ["suchalarm"]

[tool.mypy]
python_version = "3.13"
files = ["suchalarm"]
check_untyped_defs = true
warn_unused_ignores = true
