# Runs only for a release: a pushed tag (v1.0.0 etc.) or a manual run with the version. Runs the checks, then builds the
# Docker image, pushes it to ghcr.io/daaaniel06/suchalarm and creates the GitHub release from CHANGELOG.md. Pull requests: checks.yml.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, z. B. v1.0.0 (wird als Tag auf main angelegt)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image's test stage: ruff, mypy and every Python test that needs no browser, offline.
      - run: docker build --target test -t suchalarm-test . && docker run --rm --network none suchalarm-test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run -s format:check && npm run -s lint && npm test --silent

  release:
    needs: checks
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/daaaniel06/suchalarm
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Release notes from CHANGELOG.md
        run: awk -v v="## ${VERSION} " 'index($0, v) == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
